<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Kawalan Jualan & Inventori Pintar</title>
    <!-- Konfigurasi PWA (Progressive Web App) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Pendaftaran Service Worker Luar Talian -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('PWA Service Worker didaftarkan dengan jaya:', reg.scope);
            })
            .catch((err) => {
              console.error('Pendaftaran PWA Service Worker gagal:', err);
            });
        });
      }
    </script>
  </body>
</html>
