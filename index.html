<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sistem Kawalan Jualan & Inventori Pintar</title>
    
    <!-- Konfigurasi PWA (Progressive Web App) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    
    <!-- Fallback untuk pelayar lama -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Pendaftaran Service Worker untuk PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            console.log('✅ ServiceWorker berjaya didaftar dengan skop: ', registration.scope);
          }).catch(function(error) {
            console.log('❌ Pendaftaran ServiceWorker gagal: ', error);
          });
        });
      }
    </script>
  </body>
</html>
